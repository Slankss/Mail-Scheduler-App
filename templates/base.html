<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Mail Scheduler</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="{{ url_for('index') }}">Mail Scheduler</a>
            <div class="navbar-nav">
                <a class="nav-link" href="{{ url_for('index') }}">Anasayfa</a>
                <a class="nav-link" href="{{ url_for('settings_page') }}">Ayarlar</a>
                <a class="nav-link" href="{{ url_for('import_page') }}">Excel Import</a>
                <a class="nav-link" href="{{ url_for('gmail_page') }}">Gmail'den Isaretle</a>
                <a class="nav-link" href="{{ url_for('contacts_page') }}">Sirketler</a>
            </div>
        </div>
    </nav>
    <div class="container">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }}">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}
        {% block content %}{% endblock %}
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
