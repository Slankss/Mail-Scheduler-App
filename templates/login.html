<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Giris - Mail Scheduler</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container" style="max-width: 420px;">
    <div class="card shadow-sm mt-5">
        <div class="card-body p-4">
            <h1 class="h4 mb-1">Mail Scheduler</h1>
            <p class="text-muted small mb-4">Devam etmek icin giris yapin.</p>

            {% with messages = get_flashed_messages(with_categories=true) %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }} py-2">{{ message }}</div>
                {% endfor %}
            {% endwith %}

            <form method="post">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="mb-3">
                    <label class="form-label">Kullanici adi</label>
                    <input type="text" name="username" class="form-control" autocomplete="username"
                           autofocus required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Sifre</label>
                    <input type="password" name="password" class="form-control"
                           autocomplete="current-password" required>
                </div>
                <button class="btn btn-primary w-100" type="submit">Giris yap</button>
            </form>
        </div>
    </div>
</div>
</body>
</html>
